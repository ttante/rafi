name: Rewrite fast suite
on:
  push:
    branches:
      - feature/rewrite
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Code rules
        run: node scripts/check-rules.mjs
      - name: Fast suite (4 workers, under 60 s)
        run: node packages/scenarios/harness/fast.mjs
        env:
          RAFI_TEST_CONCURRENCY: "4"
      - name: Install bubblewrap (sandbox for test runs, M2 plan 1.2)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Sandbox probes (M2 plan 1.2, 1.3)
        if: runner.os != 'Windows'
        run: node --conditions=source --import tsx --test packages/engine/test/deps/sandbox.real.test.ts
      - name: Install codex-cli 0.164.0 (threat 30 profile probe, M2 plan 11 C90)
        if: runner.os != 'Windows'
        run: npm install -g @openai/codex@0.164.0
      - name: Codex builder permission profile probe (M2 plan 11.4 A11; Linux enforcement unverified until this runs)
        if: runner.os != 'Windows'
        run: node --conditions=source --import tsx --test packages/engine/test/deps/codex-profile.real.test.ts
