name: Rewrite fast suite
on:
  push:
    branches:
      - feature/rewrite
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Code rules
        run: node scripts/check-rules.mjs
      - name: Fast suite (4 workers, under 60 s)
        run: node packages/scenarios/harness/fast.mjs
        env:
          RAFI_TEST_CONCURRENCY: "4"
