services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://todo:todo@db:5432/todo
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    depends_on:
      api:
        condition: service_started
