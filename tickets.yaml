    area: Agents
    priority: P0
    size: S
    risk: Low
    depends_on: [T020]
    summary: Move ./skills (tdd, grill-me, improve-codebase-architecture, prd-to-issues, write-a-prd, better-sqlite3-rebuild) into content/skills; delete the stray root .agents/skills/grill-me duplicate; add optional pins + Codex priority to skills where useful.
    acceptance:
